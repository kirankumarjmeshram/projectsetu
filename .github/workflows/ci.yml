name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Database, E2E & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: projectsetu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/projectsetu_test
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/projectsetu_test
      AUTH_SECRET: ci-test-secret-key-that-is-at-least-32-characters-long
      APP_URL: http://localhost:3000
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting (Prettier)
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run unit & domain tests (Vitest)
        run: npm test

      - name: Apply database migrations to CI PostgreSQL service
        run: npm run db:migrate

      - name: Run PostgreSQL integration tests
        run: npm run test:db

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E browser tests
        run: npm run test:e2e

      - name: Verify Next.js production build
        run: npm run build
        env:
          NODE_ENV: production
          BUILD_STANDALONE: "true"
